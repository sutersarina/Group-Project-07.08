# Startet jeden Tag sammeln.py und speichert das neue archiv.csv im Repository.
# Streamlit Cloud merkt die Änderung und die App zeigt automatisch die neuen Daten.

name: Archiv täglich aktualisieren

on:
  schedule:
    - cron: "0 4 * * *"   # jeden Tag um 04:00 UTC (= 5 oder 6 Uhr Schweizer Zeit)
  workflow_dispatch:       # erlaubt, es im Tab "Actions" auch von Hand zu starten

permissions:
  contents: write          # nötig, damit archiv.csv gespeichert werden darf

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install pandas requests

      - name: Inserate sammeln
        run: python sammeln.py

      - name: archiv.csv speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archiv.csv
          git diff --cached --quiet || git commit -m "Archiv aktualisiert $(date +%F)"
          git push
