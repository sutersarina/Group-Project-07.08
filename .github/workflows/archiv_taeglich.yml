# AI-GENERATED: this workflow was written by Claude (Anthropic).
# Runs sammeln.py every day and saves the new archiv.csv in the repository.
# Streamlit Cloud notices the change and the app shows the new data automatically.
 
name: Update archive daily
 
on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC (= 5 a.m. Swiss time in winter)
  workflow_dispatch:       # allows starting it by hand in the "Actions" tab
 
permissions:
  contents: write          # needed so that archiv.csv may be saved
 
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install packages
        run: pip install pandas requests
 
      - name: Collect listings
        run: python sammeln.py
 
      - name: Save archiv.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archiv.csv
          git diff --cached --quiet || git commit -m "Archive updated $(date +%F)"
          git push
 